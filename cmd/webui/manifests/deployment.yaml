apiVersion: apps/v1
kind: Deployment
metadata:
  name: interlink-webui
  namespace: interlink-webui
  labels:
    app.kubernetes.io/name: interlink-webui
    app.kubernetes.io/component: web-interface
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: interlink-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: interlink-webui
        app.kubernetes.io/component: web-interface
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: webui
        image: ghcr.io/interlink-project/interlink-webui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: CONFIG_PATH
          value: "/config/webui-config.yaml"
        - name: STATIC_PATH
          value: "/static"
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: static
          mountPath: /static
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: webui-config
      - name: static
        emptyDir: {}