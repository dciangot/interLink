apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- configmap.yaml
- secret.yaml
- deployment.yaml
- service.yaml
- ingress.yaml

namespace: interlink-webui

commonLabels:
  app.kubernetes.io/name: interlink-webui
  app.kubernetes.io/part-of: interlink

images:
- name: ghcr.io/interlink-project/interlink-webui
  newTag: latest