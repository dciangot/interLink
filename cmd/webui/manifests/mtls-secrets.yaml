---
# CA Certificate Secret
apiVersion: v1
kind: Secret
metadata:
  name: interlink-ca-certs
  namespace: interlink
  labels:
    app.kubernetes.io/name: interlink
    app.kubernetes.io/component: certificates
    app.kubernetes.io/part-of: interlink
type: Opaque
data:
  ca.crt: # BASE64_ENCODED_CA_CERT
  ca.key: # BASE64_ENCODED_CA_KEY

---
# Server Certificate Secret for interLink API
apiVersion: v1
kind: Secret
metadata:
  name: interlink-server-certs
  namespace: interlink
  labels:
    app.kubernetes.io/name: interlink
    app.kubernetes.io/component: certificates
    app.kubernetes.io/part-of: interlink
type: kubernetes.io/tls
data:
  tls.crt: # BASE64_ENCODED_SERVER_CERT
  tls.key: # BASE64_ENCODED_SERVER_KEY
  ca.crt: # BASE64_ENCODED_CA_CERT

---
# Client Certificate Secret for Virtual Kubelet
apiVersion: v1
kind: Secret
metadata:
  name: interlink-client-certs
  namespace: interlink
  labels:
    app.kubernetes.io/name: interlink
    app.kubernetes.io/component: certificates
    app.kubernetes.io/part-of: interlink
type: kubernetes.io/tls
data:
  tls.crt: # BASE64_ENCODED_CLIENT_CERT
  tls.key: # BASE64_ENCODED_CLIENT_KEY
  ca.crt: # BASE64_ENCODED_CA_CERT