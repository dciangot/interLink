apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ include "interlink-wstunnel.fullname" . }}-service-create
  labels:
    {{- include "interlink-wstunnel.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: "Create Service for wstunnel Server Pods"
    policies.kyverno.io/category: "interLink"
    policies.kyverno.io/description: >-
      This policy creates a Service to expose the wstunnel server pod
      for interLink pods with exposed ports.
spec:
  admission: {{ .Values.policies.admission }}
  background: {{ .Values.policies.background }}
  rules:
  - name: create-wstunnel-service
    match:
      any:
      - resources:
          kinds:
          - Pod
    preconditions:
      all:
      # Check if pod is scheduled to virtual-kubelet node
      - key: "request.object.spec.nodeSelector.\"kubernetes.io/hostname\" || ''"
        operator: Equals
        value: "{{ .Values.virtualKubelet.nodeName }}"
      # Check if pod has tolerations for interLink virtual nodes
      - key: "request.object.spec.tolerations[?key=='{{ .Values.virtualKubelet.toleration.key }}'] | length(@)"
        operator: GreaterThan
        value: 0
      # Check if pod has exposed ports
      - key: "request.object.spec.containers[?ports] | length(@)"
        operator: GreaterThan
        value: 0
    generate:
      apiVersion: v1
      kind: Service
      name: "{{ .Values.wstunnel.serverPrefix }}-{{ `{{ request.object.metadata.name }}` }}"
      namespace: "{{ `{{ request.object.metadata.namespace }}` }}"
      synchronize: true
      data:
        metadata:
          labels:
            app: {{ .Values.wstunnel.serverLabels.app }}
            interlink.pod: "{{ `{{ request.object.metadata.name }}` }}"
            managed-by: {{ .Values.wstunnel.managedBy }}
        spec:
          type: {{ .Values.wstunnel.service.type }}
          selector:
            app: {{ .Values.wstunnel.serverLabels.app }}
            interlink.pod: "{{ `{{ request.object.metadata.name }}` }}"
          ports:
          - name: wstunnel
            port: {{ .Values.wstunnel.server.port }}
            targetPort: {{ .Values.wstunnel.server.port }}
            protocol: TCP
          - name: "port-8080"
            port: 8080
            targetPort: 8080
            protocol: TCP